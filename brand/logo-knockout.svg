<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" role="img" aria-label="Daniel Sell logo">
  <!-- Logo "negativ": Rechteck im Kartenformat 85:55, das Logo ist herausgeschnitten und zeigt den Untergrund. Farbe über currentColor. -->
  <defs>
    <mask id="ds-logo-knockout" maskUnits="userSpaceOnUse" x="0" y="0" width="850" height="550">
      <rect width="850" height="550" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="43">
        <path d="M-60 22H260V286M260 286H524V610M260 286L-60 606"/>
        <circle cx="444.8" cy="101.2" r="79.2"/>
      </g>
      <rect x="-10" y="-10" width="291.5" height="25" fill="#000"/>
    </mask>
  </defs>
  <rect width="850" height="550" fill="currentColor" mask="url(#ds-logo-knockout)"/>
</svg>
